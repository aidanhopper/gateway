# Production Server Configuration Template for Gateway Daemon
# Location: /etc/gateway/server.yaml

api:
  listen: "127.0.0.1:9090"

database: "/var/lib/gateway/gateway.db"

public: false

acme:
  email: "admin@yourdomain.com" # Required for Let's Encrypt certificates
  directory: "https://acme-v02.api.letsencrypt.org/directory"
  cloudflare_token: "" # Cloudflare DNS API token for wildcard DNS-01 challenges

firewall:
  driver: "auto" # Options: auto, ufw, iptables, pf, firewalld, dry, noop
  protected_ports:
    - 22
    - 9090

log:
  level: "info"
